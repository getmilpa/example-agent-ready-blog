name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    continue-on-error: ${{ matrix.php == '8.4' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: License gate (runtime deps must be MIT / BSD / Apache-2.0 / ISC)
        run: |
          composer licenses --no-dev --format=json | php -r '$d=json_decode(stream_get_contents(STDIN),true)?:[];$allow="~^(MIT|BSD-[0-9].*|Apache-2\\.0|ISC)$~";$bad=[];foreach(($d["dependencies"]??[]) as $n=>$i){$ls=(array)($i["license"]??[]);if($ls===[]){$bad[]="$n: (none declared)";continue;}$ok=false;foreach($ls as $l){if(preg_match($allow,(string)$l)){$ok=true;break;}}if(!$ok)$bad[]="$n: ".implode(" OR ",$ls);}if($bad){fwrite(STDERR,"Disallowed dependency licenses (only MIT/BSD/Apache-2.0/ISC allowed):\n- ".implode("\n- ",$bad)."\n");exit(1);}echo "license gate ok: ".count($d["dependencies"]??[])." runtime deps, each offered under MIT/BSD/Apache-2.0/ISC\n";'
      - name: PHP syntax
        run: find src tests bin public -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Code style (family standard, php-cs-fixer dry-run)
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress
      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite ExampleBlog
      - name: The loop itself (smoke, both paths)
        run: |
          php bin/blog.php --auto-approve | grep -q "PUBLISHED"
          rm -f var/blog.db
          php bin/blog.php --reject | grep -q "still a draft"
      - name: The process loop (smoke) — the agent is refused, a person's signature decides
        run: |
          rm -f var/blog.db var/events.jsonl
          agent=$(php bin/process.php); echo "$agent"
          grep -q "REFUSED · UNVERIFIED_APPROVER" <<<"$agent"
          grep -q "is still a DRAFT" <<<"$agent"
          php bin/enroll.php | grep -q "DEMO identity"
          person=$(php bin/decide.php --grant); echo "$person"
          grep -q "now PUBLISHED" <<<"$person"
